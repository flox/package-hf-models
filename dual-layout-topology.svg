<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .heading { font-size: 18px; font-weight: 700; fill: #c9d1d9; }
    .subheading { font-size: 12px; fill: #8b949e; }
    .dir-label { font-size: 11px; font-weight: 600; fill: #c9d1d9; }
    .dir-mono { font-size: 10px; fill: #8b949e; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .runtime-label { font-size: 13px; font-weight: 700; fill: rgba(255,255,255,0.92); }
    .runtime-detail { font-size: 10px; fill: rgba(255,255,255,0.72); font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .callout { font-size: 11px; font-weight: 600; fill: #6e8e7a; }
    .note { font-size: 10px; fill: #8b949e; font-style: italic; }
  </style>

  <rect width="960" height="600" fill="#0d1117"/>

  <text x="480" y="32" text-anchor="middle" class="heading">Dual Layout: Three Runtimes, One Copy of Weights</text>
  <text x="480" y="52" text-anchor="middle" class="subheading">Triton's weights/ is a symlink into the HF cache snapshot. Zero file duplication.</text>

  <!-- Nix store path container -->
  <rect x="140" y="75" width="680" height="360" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="160" y="98" class="dir-mono" font-weight="600" fill="#6b7d94">$out/share/models/</text>
  <text x="442" y="98" class="note">(Nix store output path)</text>

  <!-- HF Cache tree -->
  <rect x="165" y="115" width="300" height="220" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="185" y="138" class="dir-label" fill="#6b7d94">HuggingFace Cache Tree</text>
  <text x="185" y="158" class="dir-mono">hub/</text>
  <text x="200" y="176" class="dir-mono">models--org--model/</text>
  <text x="220" y="196" class="dir-mono">refs/</text>
  <text x="240" y="213" class="dir-mono">main</text>
  <text x="310" y="213" class="note">→ contains snapshot ID</text>
  <text x="220" y="236" class="dir-mono">snapshots/</text>
  <text x="240" y="256" class="dir-mono">&lt;snapshotId&gt;/</text>

  <!-- Weight files box: sage green -->
  <rect x="250" y="268" width="190" height="55" rx="6" fill="#6e8e7a" opacity="0.12" stroke="#6e8e7a" stroke-width="1.5"/>
  <text x="345" y="288" text-anchor="middle" class="dir-label" fill="#6e8e7a">Model weight files</text>
  <text x="345" y="304" text-anchor="middle" class="dir-mono">.safetensors, config, tokenizer</text>
  <text x="345" y="320" text-anchor="middle" class="callout">SINGLE COPY</text>

  <!-- Triton tree -->
  <rect x="500" y="115" width="295" height="220" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="520" y="138" class="dir-label" fill="#b07a5b">Triton Model Repository</text>
  <text x="520" y="162" class="dir-mono">&lt;tritonModelName&gt;/</text>
  <text x="540" y="182" class="dir-mono">config.pbtxt</text>
  <text x="540" y="202" class="dir-mono">model-defaults.json</text>
  <text x="540" y="226" class="dir-mono">weights/</text>

  <!-- Symlink arrow: terracotta dashed -->
  <line x1="594" y1="226" x2="594" y2="296" stroke="#b07a5b" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="594" y1="296" x2="445" y2="296" stroke="#b07a5b" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="445,290 433,296 445,302" fill="#b07a5b"/>

  <rect x="510" y="250" width="80" height="22" rx="4" fill="#b07a5b" opacity="0.15"/>
  <text x="550" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#b07a5b">symlink</text>

  <!-- Runtime boxes -->
  <!-- vLLM: slate blue -->
  <rect x="80" y="460" width="220" height="70" rx="8" fill="#6b7d94"/>
  <text x="190" y="486" text-anchor="middle" class="runtime-label">vLLM</text>
  <text x="190" y="504" text-anchor="middle" class="runtime-detail">HF_HUB_CACHE=$out/share/models/hub</text>
  <text x="190" y="518" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">refs/main → snapshots/&lt;hash&gt;</text>

  <!-- Triton: terracotta -->
  <rect x="370" y="460" width="220" height="70" rx="8" fill="#b07a5b"/>
  <text x="480" y="486" text-anchor="middle" class="runtime-label">Triton</text>
  <text x="480" y="504" text-anchor="middle" class="runtime-detail">--model-repository=$out/share/models</text>
  <text x="480" y="518" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">config.pbtxt → weights/ symlink</text>

  <!-- SGLang: dusty gold -->
  <rect x="660" y="460" width="220" height="70" rx="8" fill="#a08e5e"/>
  <text x="770" y="486" text-anchor="middle" class="runtime-label">SGLang</text>
  <text x="770" y="504" text-anchor="middle" class="runtime-detail">HF_HUB_CACHE=$out/share/models/hub</text>
  <text x="770" y="518" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">refs/main → snapshots/&lt;hash&gt;</text>

  <!-- Resolution arrows -->
  <!-- vLLM → HF cache: slate blue -->
  <line x1="190" y1="460" x2="190" y2="445" stroke="#6b7d94" stroke-width="2"/>
  <line x1="190" y1="445" x2="280" y2="445" stroke="#6b7d94" stroke-width="2"/>
  <line x1="280" y1="445" x2="280" y2="340" stroke="#6b7d94" stroke-width="2"/>
  <polygon points="274,340 280,328 286,340" fill="#6b7d94"/>

  <!-- Triton → Triton tree: terracotta -->
  <line x1="480" y1="460" x2="480" y2="445" stroke="#b07a5b" stroke-width="2"/>
  <line x1="480" y1="445" x2="600" y2="445" stroke="#b07a5b" stroke-width="2"/>
  <line x1="600" y1="445" x2="600" y2="340" stroke="#b07a5b" stroke-width="2"/>
  <polygon points="594,340 600,328 606,340" fill="#b07a5b"/>

  <!-- SGLang → HF cache: dusty gold -->
  <line x1="770" y1="460" x2="770" y2="440" stroke="#a08e5e" stroke-width="2"/>
  <line x1="770" y1="440" x2="310" y2="440" stroke="#a08e5e" stroke-width="2"/>
  <line x1="310" y1="440" x2="310" y2="340" stroke="#a08e5e" stroke-width="2"/>
  <polygon points="304,340 310,328 316,340" fill="#a08e5e"/>

  <!-- Legend -->
  <rect x="140" y="555" width="680" height="35" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <line x1="170" y1="572" x2="210" y2="572" stroke="#8b949e" stroke-width="2"/>
  <polygon points="210,566 222,572 210,578" fill="#8b949e"/>
  <text x="232" y="576" font-size="11" fill="#8b949e">Resolution path</text>

  <line x1="400" y1="572" x2="440" y2="572" stroke="#b07a5b" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="440,566 452,572 440,578" fill="#b07a5b"/>
  <text x="462" y="576" font-size="11" fill="#8b949e">Symlink (no file copy)</text>

  <rect x="640" y="564" width="14" height="14" rx="3" fill="#6e8e7a" opacity="0.15" stroke="#6e8e7a" stroke-width="1.5"/>
  <text x="664" y="576" font-size="11" fill="#8b949e">Single copy of weights</text>
</svg>
